name: Seguridad e IP
description: Registrar un riesgo de seguridad, exposición de propiedad intelectual o credenciales.
title: "[SECURITY] "
labels: []
body:
  - type: dropdown
    id: category
    attributes:
      label: Categoría
      options:
        - Visibilidad del repositorio
        - Credencial o token
        - Mapa de fuente o artefacto
        - Contaminación de dominio en apps/web
        - Dependencia o cadena de suministro
        - Otro
    validations:
      required: true

  - type: textarea
    id: exposure
    attributes:
      label: Exposición observada
      description: Qué activo, ruta o configuración está expuesto. No incluir el secreto ni datos sensibles.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impacto
      description: Qué podría ocurrir si no se corrige.
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: Remediación propuesta
      description: Pasos técnicos y decisión requerida.
    validations:
      required: true

  - type: checkboxes
    id: handling
    attributes:
      label: Manejo seguro
      options:
        - label: No se publicaron credenciales, tokens ni valores de entorno en este issue.
          required: true
        - label: La evidencia sensible se mantiene fuera del repositorio público.
          required: true

  - type: input
    id: owner
    attributes:
      label: Responsable
      description: Persona o rol responsable.
    validations:
      required: true

  - type: dropdown
    id: state
    attributes:
      label: Estado
      options:
        - Abierto
        - En análisis
        - En remediación
        - Verificado
        - Cerrado
    validations:
      required: true
