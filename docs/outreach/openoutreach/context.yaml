# Glass World Studio — contexto de prospección para OpenOutreach
#
# Este archivo es un espejo legible para humanos. OpenOutreach NO lo lee:
# la herramienta toma el contexto de la fila SiteConfig (data/db.sqlite3) y lo
# exporta como OPENOUTFIND_* / OUTSEND_* en cada ejecución.
# La fuente de verdad son product.md, target.md y signature.txt, aplicados por
# apply_context.py. Editar aquí y volver a aplicar por script.

project:
  name: Glass World Studio
  short_name: GWS
  description: >-
    Marketplace Vertical integral para la industria global del vidrio.
  value_proposition: >-
    Una plataforma con alma de taller, que se fortalece con tu crecimiento.
  status: >-
    Proyecto formalizado; trámite de propiedad intelectual y marca en curso ante el INPI.
  architecture:
    galaxies:
      - Maestros (Creadores/Escuelas)
      - Comercio (Marketplace/B2B)
      - Comunidad
      - Bono Silicato & Envases (Sostenibilidad)
      - Industria
      - Materiales/Componentes
    satellites:
      - Radar de Oferta y Demanda
      - Radar de Ingeniería Predictiva (Termia/COE)
      - Portal de Profesionales (Técnicos/Científicos)
      - Rincón del Usado GWS
      - Bóveda del Conocimiento

